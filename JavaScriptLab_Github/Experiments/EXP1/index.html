<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Experiment 1</title>

    <!-- Internal JavaScript -->
    <script>
        function showWelcome() {

            console.info("Welcome button clicked.");

            var name = "Shruti Bawankar";

            document.getElementById("welcome").innerHTML =
            "Welcome, " + name + "!";

            document.getElementById("name").innerHTML = name;
            document.getElementById("prn").innerHTML = "24070521148";
            document.getElementById("course").innerHTML = "B.Tech CSE";
            document.getElementById("college").innerHTML =
            "Symbiosis Institute of Technology";
        }
    </script>

    <!-- External JavaScript -->
    <script src="script.js"></script>

    <style>
        body{
            font-family:Arial,sans-serif;
            background:#e8f4ff;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .card{
            width:400px;
            background:white;
            padding:25px;
            border-radius:12px;
            text-align:center;
            box-shadow:0 5px 15px rgba(0,0,0,.2);
        }

        button{
            padding:10px 18px;
            margin:8px;
            border:none;
            border-radius:6px;
            cursor:pointer;
            background:#007BFF;
            color:white;
            font-size:15px;
        }

        button:hover{
            background:#0056b3;
        }

        h2{
            color:#007BFF;
        }
    </style>

</head>

<body>

<div class="card">

<h2 id="welcome">Welcome!</h2>

<p><b>Name:</b> <span id="name">-</span></p>
<p><b>PRN:</b> <span id="prn">-</span></p>
<p><b>Course:</b> <span id="course">-</span></p>
<p><b>College:</b> <span id="college">-</span></p>

<br>

<!-- Inline JavaScript -->
<button onclick="console.log('Inline JavaScript executed'); alert('Welcome, Shruti Bawankar! Inline JavaScript executed');">
Inline JS
</button>

<!-- Internal JavaScript -->
<button onclick="showWelcome()">
Internal JS
</button>

<!-- External JavaScript -->
<button onclick="externalDemo()">
External JS
</button>

</div>

</body>
</html>
