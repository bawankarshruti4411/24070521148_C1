<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaCart - Smart Shopping Cart</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="brand">
                <div class="brand-icon">N</div>
                <div>
                    <h1>NovaCart</h1>
                    <p>Smart shopping, simplified.</p>
                </div>
            </div>
            <div class="cart-badge">
                🛒 <span id="cartCount">0</span>
            </div>
        </header>
        <main class="main-content">
            <section class="products-section">
                <div class="section-heading">
                    <div>
                        <span class="eyebrow">SHOP</span>
                        <h2>Featured Products</h2>
                    </div>
                    <span class="product-count" id="productCount"></span>
                </div>
                <div class="products-grid" id="productsGrid"></div>
            </section>
            <aside class="cart-panel">

                <div class="cart-header">
                    <div>
                        <span class="eyebrow">YOUR ORDER</span>
                        <h2>Shopping Cart</h2>
                    </div>
                    <span id="cartItemsLabel">0 items</span>
                </div>

                <div id="cartContainer" class="cart-container"></div>

                <div id="emptyCart" class="empty-cart">
                    <div class="empty-icon">🛍️</div>
                    <h3>Your cart is empty</h3>
                    <p>Add some products to get started.</p>
                </div>
                <div id="discountBox" class="discount-box"></div>
                <div class="summary">
                    <div class="summary-row">
                        <span>Subtotal</span>
                        <strong>₹<span id="subtotal">0</span></strong>
                    </div>
                    <div class="summary-row discount-row">
                        <span>Discount</span>
                        <strong>- ₹<span id="discount">0</span></strong>
                    </div>
                    <div class="summary-row">
                        <span>Tax <small>(18%)</small></span>
                        <strong>₹<span id="tax">0</span></strong>
                    </div>
                    <div class="separator"></div>
                    <div class="total-row">
                        <span>Total</span>
                        <strong>₹<span id="total">0</span></strong>
                    </div>
                    <div class="savings">
                        🎉 You save ₹<span id="savings">0</span>
                    </div>
                    <button class="checkout-btn" onclick="checkout()">
                        Proceed to Checkout
                        <span>→</span>
                    </button>
                </div>
            </aside>
        </main>
        <footer>
            <p>© 2026 NovaCart · Secure & transparent pricing</p>
        </footer>
    </div>
    <div id="toast" class="toast"></div>
    <script src="script.js"></script>
</body>
</html>
