<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreshMart - Smart Billing</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
<div class="container">
    <header>
        <div class="logo">
            <h1>
                <i class="fa-solid fa-cart-shopping"></i>
                FreshMart
            </h1>
            <p>Fresh Fruits • Vegetables • Grocery</p>
        </div>
        <div class="title">
            <h2>
                <i class="fa-solid fa-receipt"></i>
                Smart Billing
            </h2>
        </div>
    </header>

    <hr>

    <!-- ================= MAIN ================= -->

    <main>

        <!-- ================= LEFT PANEL ================= -->

        <section class="left-panel">

            <h2>
                🍎 Product Details
            </h2>

            <form id="billingForm">

                <div class="input-group">

                    <label>
                        <i class="fa-solid fa-user"></i>
                        Customer Name
                    </label>

                    <input
                            type="text"
                            id="customerName"
                            placeholder="Enter customer name">
                </div>


                <div class="input-group">

                    <label>
                        <i class="fa-solid fa-mobile-screen-button"></i>
                        Mobile Number
                    </label>

                    <input
                            type="tel"
                            id="mobile"
                            maxlength="10"
                            placeholder="10 digit mobile number">

                </div>


                <div class="input-group">

                    <label>
                        <i class="fa-solid fa-cart-shopping"></i>
                        Product Name
                    </label>

                    <select id="product">

                        <option value="">Select Product</option>

                        <option value="Apple"
                                data-rate="250">
                            Apple
                        </option>

                        <option value="Banana"
                                data-rate="80">
                            Banana
                        </option>

                        <option value="Mango"
                                data-rate="180">
                            Mango
                        </option>

                    </select>

                </div>


                <div class="input-group">

                    <label>
                        <i class="fa-solid fa-weight-hanging"></i>
                        Quantity (Kg)
                    </label>

                    <input
                            type="number"
                            id="quantity"
                            min="1"
                            placeholder="Enter quantity">

                </div>


                <div class="input-group">

                    <label>
                        <i class="fa-solid fa-sack-dollar"></i>
                        Rate / Kg
                    </label>

                    <input
                            type="number"
                            id="rate"
                            readonly>

                </div>


                <div class="input-group">

                    <label>
                        <i class="fa-solid fa-star"></i>
                        Membership
                    </label>

                    <select id="member">

                        <option value="No">No</option>

                        <option value="Yes">Yes</option>

                    </select>
                </div>
                <div class="input-group">
                    <label>
                        <i class="fa-solid fa-credit-card"></i>
                        Payment Mode
                    </label>
                    <select id="payment">
                        <option>Cash</option>
                        <option>Card</option>
                        <option>UPI</option>
                    </select>
                </div>
                <div class="button-group">
                    <button
                            type="button"
                            id="calculateBtn">
                        Calculate Bill
                    </button>
                    <button
                            type="reset"
                            id="resetBtn">
                        Reset
                    </button>
                </div>
            </form>
        </section>
        <section class="right-panel">
            <h2>
                <i class="fa-solid fa-file-invoice"></i>
                Invoice Summary
            </h2>
            <div class="invoice">
                <p>
                    Invoice #
                    <span id="invoiceNo">
                        INV-1001
                    </span>
                </p>
                <p>
                    Date
                    <span id="currentDate"></span>
                </p>
                <p>
                    Customer
                    <span id="outCustomer">-</span>
                </p>
                <p>
                    Product
                    <span id="outProduct">-</span>
                </p>
                <hr>
                <p>
                    Quantity
                    <span id="outQty">0 Kg</span>
                </p>
                <p>
                    Rate
                    <span id="outRate">₹0</span>
                </p>
                <hr>
                <p>
                    Subtotal
                    <span id="subtotal">₹0</span>
                </p>
                <p>
                    Discount
                    <span id="discount">₹0</span>
                </p>
                <p>
                    GST (5%)
                    <span id="gst">₹0</span>
                </p>
                <p>
                    Packing
                    <span id="packing">₹50</span>
                </p>
                <hr>
                <h3>
                    TOTAL
                    <span id="total">
                        ₹0
                    </span>
                </h3>
            </div>
        </section>
    </main>
</div>
<script src="script.js"></script>
</body>
</html>
