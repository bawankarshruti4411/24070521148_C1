<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password Strength Checker</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Lucida Console', 'Monaco', monospace;
}
body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#89949810,#84b2da);
}
.container{
    width:400px;
    background:white;
    border-radius:18px;
    padding:35px;
    text-align:center;
    box-shadow:
    0 15px 35px rgba(0,0,0,0.2);
}
.icon{
    font-size:55px;
    margin-bottom:10px;
}
h2{
    color:#333;
    margin-bottom:8px;
}
p.subtitle{
    color:#777;
    margin-bottom:25px;
    font-size:14px;
}
.input-box{
    position:relative;
}
input{
    width:100%;
    padding:14px 16px;
    border:2px solid #ddd;
    border-radius:10px;
    outline:none;
    font-size:16px;
    transition:.3s;
}
input:focus{
   border-color:#33a060;
}
button{
    width:100%;
    margin-top:18px;
    padding:14px;
    border:none;
    border-radius:10px;
    background:#667eea;
    color:white;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:.3s;
}
button:hover{
    background:#4f61d8;
    transform:translateY(-2px);
}
#result{
    margin-top:22px;
    padding:14px;
    border-radius:10px;
    background:#f7f7f7;
    font-size:17px;
    font-weight:600;
    min-height:55px;
    display:flex;
    justify-content:center;
    align-items:center;
}
#count{
    margin-top:15px;
    color:#555;
    font-size:14px;
}
.footer{
    margin-top:20px;
    font-size:12px;
    color:#999;
}
</style>
</head>
<body>
<div class="container">
<div class="icon">🔐</div>
<h2>Password Strength Checker</h2>
<p class="subtitle">
A palindrome password is considered <b>Weak</b>.
Any other password is considered <b>Strong</b>.
</p>
<div class="input-box">
<input
type="password"
id="password"
placeholder="Enter your password">
</div>
<button onclick="checkPassword()">
Check Password
</button>
<div id="result">
Result will appear here...
</div>
<div id="count">
</div>
</div>
<script src="script.js"></script>
</body>
</html>
